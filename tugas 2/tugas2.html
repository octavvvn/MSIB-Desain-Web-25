<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tugas 2 - Data Pegawai</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      table {
        border-collapse: collapse;
        width: 70%;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        animation: fadeIn 1s ease-in-out;
      }

      thead {
        background: #2a5298;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      thead th {
        padding: 15px;
        font-size: 15px;
      }

      tbody td {
        padding: 14px;
        text-align: center;
        font-size: 14px;
        color: #444;
      }

      tbody tr:nth-child(even) {
        background: #f3f6fa;
      }

      tbody tr:hover {
        background: #e0ecff;
        transition: 0.3s;
      }

      tfoot {
        background: #f1f1f1;
        font-weight: bold;
        text-align: center;
      }

      tfoot td {
        padding: 14px;
        font-size: 14px;
        color: #222;
      }

      h2 {
        text-align: center;
        color: #fff;
        margin-bottom: 20px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Data Pegawai</h2>
      <table border="1">
        <thead>
          <tr>
            <th>Nama Pegawai</th>
            <th>Umur</th>
            <th>Jabatan</th>
            <th>Status</th>
            <th>Gaji Pokok</th>
            <th>Tunjangan Jabatan</th>
            <th>BPJS</th>
            <th>Tunjangan Keluarga</th>
          </tr>
        </thead>
        <tbody id="dataPegawai"></tbody>
        <tfoot>
          <tr>
            <td colspan="7">Total Gaji</td>
            <td id="totalGaji"></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <script>
      //data pegawai tunggal
      let nama = "Dodi Prayodi";
      let umur = 25;
      let jabatan = "Manajer";
      let status = "Menikah";

      //hitung gaji pokok
      let gajiPokok = 0;
      if (jabatan.toLowerCase() === "manajer") {
        gajiPokok = 15000000;
      } else if (jabatan.toLowerCase() === "asisten manajer") {
        gajiPokok = 10000000;
      } else {
        gajiPokok = 5000000;
      }

      //hitung tunjangan
      let tunjanganJabatan = 0.15 * gajiPokok;
      let bpjs = 0.1 * gajiPokok;
      let tunjanganKeluarga =
        status.toLowerCase() === "menikah" ? 0.2 * gajiPokok : 0;

      //total gaji (jumlahkan semua komponen)
      let totalGaji = gajiPokok + tunjanganJabatan + bpjs + tunjanganKeluarga;

      //cetak ke tabel
      document.getElementById("dataPegawai").innerHTML = `
      <tr>
        <td>${nama}</td>
        <td>${umur} Tahun</td>
        <td>${jabatan}</td>
        <td>${status}</td>
        <td>Rp ${gajiPokok.toLocaleString()}</td>
        <td>Rp ${tunjanganJabatan.toLocaleString()}</td>
        <td>Rp ${bpjs.toLocaleString()}</td>
        <td>Rp ${tunjanganKeluarga.toLocaleString()}</td>
      </tr>
    `;
      document.getElementById("totalGaji").innerText =
        "Rp " + totalGaji.toLocaleString();
    </script>
  </body>
</html>
