    <!-- ===== LOGIN FORM ===== -->
    <div class="container my-5">
      <h2 class="text-center mb-3">Welcome Back</h2>
      <p class="text-center text-muted mb-4">
        Log in to access the student portal and manage your profile, study
        records, and data.
      </p>
      <form class="w-50 mx-auto shadow p-4 rounded bg-white">
        <div class="mb-3">
          <label for="username" class="form-label">Username or Email</label>
          <input
            type="text"
            class="form-control"
            id="username"
            placeholder="Enter your username or email"
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Enter your password"
          />
        </div>
        <button type="submit" class="btn btn-dark w-100">Login</button>
        <div class="d-flex justify-content-between mt-3">
          <a href="#" class="text-decoration-none">Forgot Password?</a>
          <a href="#" class="text-decoration-none">Create Account</a>
        </div>
      </form>
    </div>
