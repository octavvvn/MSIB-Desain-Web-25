<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Right</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap");
      body {
        margin: 0;
        padding: 20px;
        background: #ffffff;
        font-family: "Poppins", sans-serif;
        color: #333;
      }
      fieldset {
        border: 2px solid #6c63ff;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        background: #fff;
      }
      legend {
        color: #6c63ff;
        font-weight: 600;
        font-size: 18px;
        padding: 0 8px;
      }
      ol {
        padding-left: 20px;
        margin: 15px 0 0 0;
      }
      li {
        margin: 12px 0;
        font-size: 15px;
      }
      a {
        color: #ff6b6b;
        text-decoration: none;
        transition: 0.3s;
        font-weight: 500;
      }
      a:hover {
        text-decoration: underline;
        color: #e63946;
      }
    </style>
  </head>
  <body>
    <fieldset>
      <legend>Fullstack Materials</legend>
      <ol>
        <li>
          <a
            href="https://developer.mozilla.org/en-US/docs/Web/HTML"
            target="_blank"
            >HTML</a
          >
        </li>
        <li>
          <a
            href="https://developer.mozilla.org/en-US/docs/Web/CSS"
            target="_blank"
            >CSS</a
          >
        </li>
        <li>
          <a
            href="https://developer.mozilla.org/en-US/docs/Web/JavaScript"
            target="_blank"
            >JavaScript</a
          >
        </li>
        <li><a href="https://react.dev/" target="_blank">ReactJS</a></li>
        <li><a href="https://nodejs.org/" target="_blank">NodeJS</a></li>
      </ol>
    </fieldset>
  </body>
</html>
