<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MyStudy</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap");
      body {
        margin: 0;
        padding: 40px;
        background: #ffffff;
        font-family: "Poppins", sans-serif;
        color: #333;
      }
      h2 {
        color: #6c63ff;
        margin-bottom: 25px;
        text-align: center;
        font-size: 28px;
        font-weight: 600;
      }
      table {
        width: 80%;
        margin: 0 auto;
        border-collapse: separate;
        border-spacing: 0;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        background: #fff;
      }
      th,
      td {
        padding: 14px 18px;
        text-align: left;
        font-size: 15px;
      }
      th {
        background: #6c63ff;
        color: #fff;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      tr:nth-child(even) {
        background: #f9f9ff;
      }
      tr:hover td {
        background: #ece9ff;
        transition: 0.3s ease;
      }
    </style>
  </head>
  <body>
    <h2>Education History</h2>
    <table>
      <tr>
        <th>Level</th>
        <th>School</th>
        <th>Year</th>
      </tr>
      <tr>
        <td>Senior High School</td>
        <td>SMAN 1 Kalapnunggal</td>
        <td>2019-2022</td>
      </tr>
      <tr>
        <td>College</td>
        <td>STT Terpadu Nurul Fikri</td>
        <td>2023-Present</td>
      </tr>
    </table>
  </body>
</html>
