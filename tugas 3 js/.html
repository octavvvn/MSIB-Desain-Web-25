<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tugas 3 JS - Manajemen Produk</title>
</head>
<body>
  <h2>Daftar Produk Toko</h2>
  <div id="daftarProduk"></div>

  <script>
    // array produk awal
    let produkToko = [
      { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },
      { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
      { id: 3, nama: "Keyboard", harga: 350000, stok: 7 }
    ];

    // fungsi menampilkan daftar produk
    function tampilkanProduk() {
      let output = "<ul>";
      produkToko.forEach(p => {
        output += `<li>ID: ${p.id}, Nama: ${p.nama}, Harga: Rp${p.harga}, Stok: ${p.stok}</li>`;
      });
      output += "</ul>";
      document.getElementById("daftarProduk").innerHTML = output;
    }

    // fungsi menambah produk baru
    function tambahProduk(nama, harga, stok) {
      let idBaru = produkToko.length > 0 ? produkToko[produkToko.length - 1].id + 1 : 1;
      let produkBaru = { id: idBaru, nama: nama, harga: harga, stok: stok };
      produkToko.push(produkBaru);
      tampilkanProduk();
    }

    // fungsi menghapus produk berdasarkan id
    function hapusProduk(id) {
      let index = produkToko.findIndex(p => p.id === id);
      if (index !== -1) {
        produkToko.splice(index, 1);
        tampilkanProduk();
      }
    }

    // contoh penggunaan
    tampilkanProduk();
    tambahProduk("Headset", 150000, 8);
    hapusProduk(2);
  </script>
</body>
</html>
