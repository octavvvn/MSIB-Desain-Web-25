<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Gallery Flip</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap");
      body {
        margin: 0;
        padding: 40px;
        background: #ffffff;
        font-family: "Poppins", sans-serif;
        color: #333;
      }
      h2 {
        color: #6c63ff;
        margin-bottom: 25px;
        text-align: center;
        font-size: 28px;
        font-weight: 600;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 25px;
      }
      .card {
        perspective: 1000px;
      }
      .card-inner {
        position: relative;
        width: 100%;
        height: 200px;
        transition: transform 0.8s;
        transform-style: preserve-3d;
      }
      .card:hover .card-inner {
        transform: rotateY(180deg);
      }
      .card-front,
      .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 15px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        overflow: hidden;
      }
      .card-front img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card-back {
        background: #6c63ff;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 600;
        transform: rotateY(180deg);
      }
    </style>
  </head>
  <body>
    <h2>My Gallery</h2>
    <div class="gallery">
      <div class="card">
        <div class="card-inner">
          <div class="card-front">
            <img
              src="https://i.pinimg.com/736x/68/4c/39/684c3932ad974c658eea19c9f351554a.jpg"
              alt="img1"
            />
          </div>
          <div class="card-back">page 1</div>
        </div>
      </div>
      <div class="card">
        <div class="card-inner">
          <div class="card-front">
            <img
              src="https://i.pinimg.com/1200x/36/d6/cf/36d6cf9ae1059f71858bdaf3c97c9d8a.jpg"
              alt="img2"
            />
          </div>
          <div class="card-back">page 2</div>
        </div>
      </div>
      <div class="card">
        <div class="card-inner">
          <div class="card-front">
            <img
              src="https://i.pinimg.com/736x/e3/08/ee/e308eedf0ca6ecacbaae866f2abf81d0.jpg"
              alt="img3"
            />
          </div>
          <div class="card-back">page 3</div>
        </div>
      </div>
    </div>
  </body>
</html>
