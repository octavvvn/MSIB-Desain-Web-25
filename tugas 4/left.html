        font-family: "Poppins", sans-serif;
      }

        border: none;
        border-radius: 16px;
        padding: 22px;
        background: #ffffff;

      legend {

        font-size: 20px;
        color: #6c63ff;
        padding: 0 8px;
      }
      a {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0;
        padding: 10px 14px;
        border-radius: 10px;
        background: #f4f4ff;
        color: #333;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
      }
      a:hover {
        background: #6c63ff;
        color: #fff;
      }
