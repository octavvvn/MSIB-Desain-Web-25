<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Right</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap");
      body {
        margin: 0;
        padding: 20px;
        background: #ffffff;
        font-family: "Poppins", sans-serif;
        color: #333;
      }
      fieldset {
        border: none;
        border-radius: 16px;
        padding: 22px;
        background: #ffffff;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      }
      legend {
        font-weight: 600;
        font-size: 20px;
        color: #6c63ff;
        padding: 0 8px;
      }
      ol {
        list-style: none;
        margin: 15px 0 0 0;
        padding: 0;
      }
      li {
        margin: 14px 0;
      }
      a {
        display: block;
        padding: 10px 14px;
        border-radius: 10px;
        background: #f4f4ff;
        color: #333;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
      }
      a:hover {
        background: #6c63ff;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <fieldset>
      <legend>Fullstack Materials</legend>
      <ol>
        <li>
          <a
            href="https://developer.mozilla.org/en-US/docs/Web/HTML"
            target="_blank"
            >HTML</a
          >
        </li>
        <li>
          <a
            href="https://developer.mozilla.org/en-US/docs/Web/CSS"
            target="_blank"
            >CSS</a
          >
        </li>
        <li>
          <a
            href="https://developer.mozilla.org/en-US/docs/Web/JavaScript"
            target="_blank"
            >JavaScript</a
          >
        </li>
        <li>
          <a href="https://react.dev/" target="_blank">ReactJS</a>
        </li>
        <li>
          <a href="https://nodejs.org/" target="_blank">NodeJS</a>
        </li>
      </ol>
    </fieldset>
  </body>
</html>
